; Loaded after www.conf (alphabetical include order), overriding just this
; one directive. Docker images' default pool ships with clear_env unset,
; which PHP-FPM defaults to `yes` — that strips the container's real
; environment variables from every worker, so config('database.*') etc.
; would silently fall back to whatever's baked into a .env file (the same
; class of bug the built-in-server workaround hit, for a different reason).
[www]
clear_env = no
